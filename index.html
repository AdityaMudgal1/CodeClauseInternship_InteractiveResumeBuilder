<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Resume Builder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Interactive Resume Builder</h1>
    <p>Create a professional resume instantly</p>
  </header>

  <main class="container">

    <!-- FORM SECTION -->
    <section class="form-section">
      <h2>Enter Your Details</h2>

      <input id="name" type="text" placeholder="Full Name" />
      <input id="email" type="email" placeholder="Email Address" />
      <input id="phone" type="text" placeholder="Phone Number" />
      
      <textarea id="summary" placeholder="Professional Summary"></textarea>
      <textarea id="skills" placeholder="Skills (comma separated)"></textarea>
      <textarea id="experience" placeholder="Work Experience"></textarea>

      <div class="btn-group">
        <button onclick="generateResume()">Generate Resume</button>
        <button class="secondary" onclick="printResume()">Export as PDF</button>
      </div>
    </section>

    <!-- PREVIEW SECTION -->
    <section class="preview-section" id="resume">
      <h2 id="r-name">Your Name</h2>
      <p id="r-email"></p>
      <p id="r-phone"></p>

      <hr />

      <h3>Summary</h3>
      <p id="r-summary">Your professional summary will appear here.</p>

      <h3>Skills</h3>
      <ul id="r-skills"></ul>

      <h3>Experience</h3>
      <p id="r-experience"></p>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
